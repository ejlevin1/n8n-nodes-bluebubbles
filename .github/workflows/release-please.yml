# Automated semver releases driven by Conventional Commits.
#
# On every push to main, release-please opens/updates a "chore(main): release X.Y.Z"
# PR that bumps package.json, .release-please-manifest.json and CHANGELOG.md.
# Merging that PR makes this same workflow create the vX.Y.Z tag + GitHub Release,
# then the `publish` job builds n8n-nodes-bluebubbles-X.Y.Z.tgz, attaches it to the
# release and publishes that exact tarball to npm.
#
# The build/upload/publish must live in this workflow file:
# - tags and releases created with GITHUB_TOKEN do not trigger other workflows
#   (e.g. an `on: push: tags`);
# - the npm trusted publisher is bound to the filename `release-please.yml`, and
#   OIDC tokens from a reusable workflow (workflow_call) would not match it.
#
# npm publishing uses OIDC trusted publishing (no NPM_TOKEN). It is gated by the
# repository variable NPM_PUBLISH: the step is skipped unless it is 'true'.
#
# Install in n8n with:
#   npm i --omit=peer n8n-nodes-bluebubbles
# or from the GitHub Release:
#   npm i --omit=peer https://github.com/ejlevin1/n8n-nodes-bluebubbles/releases/download/vX.Y.Z/n8n-nodes-bluebubbles-X.Y.Z.tgz
name: Release Please

on:
  push:
    branches:
      - main

# Deny by default; each job requests only what it needs.
permissions: {}

# Never run two release jobs at once; let a queued run finish rather than cancel.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only when merging the release PR created a release.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the tarball to the GitHub Release
      id-token: write # OIDC token for npm trusted publishing (and provenance)

    steps:
      - uses: actions/checkout@v7

      # No dependency cache in release builds; registry-url writes the .npmrc
      # that npm uses for the OIDC token exchange.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1. Node 24's bundled npm satisfies
      # this; fail loudly instead of silently upgrading if that ever changes.
      - name: Check npm version supports trusted publishing
        run: |
          NPM_VERSION="$(npm --version)"
          echo "npm ${NPM_VERSION}"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) { console.error("npm >= 11.5.1 is required for trusted publishing"); process.exit(1); }
          ' "$NPM_VERSION"

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Verify package.json version matches the release
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$RELEASE_VERSION" ]; then
            echo "package.json version ${PKG_VERSION} does not match release ${RELEASE_VERSION}" >&2
            exit 1
          fi

      - name: Build and pack
        id: pack
        run: |
          npm run build
          TARBALL="$(npm pack --silent | tail -n 1)"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Upload tarball to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: gh release upload "$TAG_NAME" "./${TARBALL}" --clobber

      # Publishes the same tarball that was attached to the GitHub Release.
      # Publishing a tarball does not run package.json lifecycle scripts, so the
      # prepublishOnly guard (which blocks working-tree publishes) does not apply.
      # Provenance is generated automatically (public repo + public package).
      - name: Publish to npm (trusted publishing)
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "./${TARBALL}" --access public
